name: Vérifications de base

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
      - name: Vérifier la syntaxe Python
        run: python -m compileall -q tools
      # tous les outils (envoyer-push.js et notifier-demandes.js tournent
      # dans les robots) et les scripts de la page (check du 05/11/2026)
      - name: Vérifier la syntaxe JavaScript
        run: |
          for f in tools/*.js sw.js; do node --check "$f"; done
          node -e 'const fs=require("fs"),h=fs.readFileSync("index.html","utf8"),re=/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/g;let m,i=0;while((m=re.exec(h))){fs.writeFileSync(process.env.RUNNER_TEMP+"/page-"+(i++)+".js",m[1]);}'
          for f in "$RUNNER_TEMP"/page-*.js; do node --check "$f"; done
      # le garde-fou des noms : un commit fait sur le site de GitHub, ou avec
      # --no-verify, échappe au crochet local (check du 05/11/2026)
      - name: Aucune forme de nom dans le dépôt
        run: python tools/verifier-depot.py
      - name: Le robot n'accepte qu'un expéditeur authentifié
        run: python tools/horaire-auto.py --epreuve-expediteur
      - name: Congés scolaires recoupés avec les arrêtés
        run: node tools/verifier-conges-scolaires.js
      - name: Vérifier la structure de l'horaire
        run: python tools/ci-smoke.py
