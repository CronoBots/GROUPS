<!-- Le modèle de l'e-mail du code de connexion. À coller dans Supabase
     (Authentication → Emails → Templates), pour « Magic Link » ET « Confirm
     signup ». Objet : Votre code BIOWANZE   (sans le code)

     Le 21/10/2026, le modèle sombre (logo distant, texte caché, code dans
     l'objet, 6,7 Ko) partait bien de Gmail mais n'arrivait plus dans
     Outlook, alors que le modèle de trois paragraphes qui l'avait précédé
     (1,1 Ko, objet « Votre code BIOWANZE ») arrivait à chaque fois. On
     revient donc au plus près de ce qui passait : pas d'image, pas de texte
     caché, pas de code dans l'objet, quelques styles en ligne. Ce n'est
     qu'après un envoi depuis un domaine de l'entreprise (biowanze.app,
     avec SPF et DKIM) qu'un modèle plus riche pourra revenir. -->
<div style="font-family:Segoe UI, Arial, sans-serif;font-size:14px;line-height:22px;color:#1F2433;">
<p style="margin:0 0 4px 0;font-size:12px;font-weight:bold;letter-spacing:1px;color:#2E7FA0;">BIOWANZE</p>
<p style="margin:0 0 14px 0;">Votre code de connexion à l'application&nbsp;:</p>
<p style="margin:0 0 14px 0;font-family:Consolas, Courier New, monospace;font-size:28px;line-height:34px;font-weight:bold;letter-spacing:4px;">{{ .Token }}</p>
<p style="margin:0 0 14px 0;">Il est valable une heure et ne sert qu'une fois. Si vous n'avez rien demandé, ignorez ce message.</p>
<p style="margin:0;font-size:12px;color:#6B7180;">Message automatique, ne pas y répondre.</p>
</div>
